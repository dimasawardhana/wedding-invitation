name: CI

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  backend:
    name: Backend — go test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: wedding-invitation-be
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: wedding-invitation-be/go.mod
      - run: go test ./... -shuffle=on

  frontend:
    name: Frontend — lint + type-check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: wedding-invitation-fe
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: wedding-invitation-fe/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run type-check

  e2e:
    name: E2E — Playwright
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    defaults:
      run:
        working-directory: wedding-invitation-fe
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: wedding-invitation-be/go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: wedding-invitation-fe/package-lock.json
      - run: npm ci
      # Playwright browsers need network here (runner has it, unlike some
      # dev machines); Chrome dep comes from the install command itself.
      - run: npx playwright install --with-deps chromium
      # No port collisions on a fresh runner, but shift anyway so CI and local
      # never disagree about which stack binds what.
      - name: Run e2e suite
        run: |
          export DB_PORT=15432 MINIO_API_PORT=19000 MINIO_CONSOLE_PORT=19001 E2E_API_PORT=18090
          npm run test:e2e:all
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-results
          path: wedding-invitation-fe/test-results/
          retention-days: 7
